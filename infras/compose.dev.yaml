# 开发档。源码挂载，依赖在命名卷里。镜像是开发镜像，不是制品镜像。
services:
  minio:
    volumes:
      - miniodata:/data

  deps:
    build:
      context: ./docker
      dockerfile: dev.Dockerfile
    command: ["/bin/sh", "/opt/install-deps.sh"]
    environment:
      CI: "true"
    volumes:
      - ..:/workspace
      - ./docker/install-deps.sh:/opt/install-deps.sh:ro
      - dev_node_modules:/workspace/node_modules
      - dev_backend_node_modules:/workspace/apps/backend/node_modules
      - dev_frontend_node_modules:/workspace/apps/frontend/node_modules
      - dev_shield_node_modules:/workspace/packages/shield/node_modules
      - pnpm_store:/pnpm/store
    restart: "no"

  backend:
    build:
      context: ./docker
      dockerfile: dev.Dockerfile
    restart: unless-stopped
    command: ["pnpm", "--filter", "@gzgt/backend", "start:dev"]
    environment:
      CI: "true"
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-gzgt}:${POSTGRES_PASSWORD:-gzgt-dev-only}@db:5432/${POSTGRES_DB:-gzgt}
    volumes:
      - ..:/workspace
      - dev_node_modules:/workspace/node_modules
      - dev_backend_node_modules:/workspace/apps/backend/node_modules
      - dev_backend_dist:/workspace/apps/backend/dist
      - dev_frontend_node_modules:/workspace/apps/frontend/node_modules
      - dev_shield_node_modules:/workspace/packages/shield/node_modules
      - pnpm_store:/pnpm/store
    depends_on:
      deps:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  frontend:
    build:
      context: ./docker
      dockerfile: dev.Dockerfile
    restart: unless-stopped
    command: ["pnpm", "--filter", "@gzgt/frontend", "dev"]
    environment:
      CI: "true"
    volumes:
      - ..:/workspace
      - dev_node_modules:/workspace/node_modules
      - dev_backend_node_modules:/workspace/apps/backend/node_modules
      - dev_frontend_node_modules:/workspace/apps/frontend/node_modules
      - dev_shield_node_modules:/workspace/packages/shield/node_modules
      - pnpm_store:/pnpm/store
    depends_on:
      deps:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dev_node_modules:
  dev_backend_node_modules:
  dev_backend_dist:
  dev_frontend_node_modules:
  dev_shield_node_modules:
  pnpm_store:
