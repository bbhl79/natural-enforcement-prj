# 联调档。使用制品镜像，不挂源码。
services:
  minio:
    volumes:
      - miniodata:/data

  db-migrate:
    build:
      context: ./docker
      dockerfile: dev.Dockerfile
    environment:
      CI: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-gzgt}:${POSTGRES_PASSWORD:-gzgt-dev-only}@db:5432/${POSTGRES_DB:-gzgt}
    volumes:
      - ..:/workspace
      - integration_node_modules:/workspace/node_modules
      - integration_backend_node_modules:/workspace/apps/backend/node_modules
      - pnpm_store:/pnpm/store
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "pnpm install --frozen-lockfile --filter @gzgt/backend... && pnpm --filter @gzgt/backend exec prisma migrate deploy"

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-gzgt}:${POSTGRES_PASSWORD:-gzgt-dev-only}@db:5432/${POSTGRES_DB:-gzgt}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/integration.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  integration_node_modules:
  integration_backend_node_modules:
  pnpm_store:
