<!doctype html>

<head>

<title>广州市规划和自然资源局监督监管与执法协同系统 · 线索登记与分派</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.55}

.brand{font-weight:650;font-size:15px;color:var(--green-press)}.proto{background:var(--green-soft);color:var(--green-press);border:1px solid #b7d7c8;border-radius:4px;padding:1px 8px;font-size:11px;font-weight:600}
.shell{display:flex;min-height:calc(100vh - 84px);align-items:stretch}
.sidenav{width:196px;background:var(--white);border-right:1px solid var(--border);padding:14px 10px;flex-shrink:0}
.nav-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;color:#44403c;margin-bottom:3px;cursor:pointer}
.nav-item.on{background:var(--green-soft);color:var(--green-press);font-weight:600}.nav-item .n{background:#e7e5e4;border-radius:10px;padding:0 7px;font-size:11px}
.main{flex:1;width:100%;padding:16px 24px 48px;min-width:0}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:12px}
.page-h h1{font-size:18px;font-weight:650}.page-h .desc{color:var(--muted);margin-top:2px;font-size:12px}
.btn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--white);color:var(--ink);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-weight:500}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green)}.btn-primary:hover{background:var(--green-press)}
.btn-line{border-color:var(--green);color:var(--green-press);background:#fff}.btn-line:hover{background:var(--green-soft)}
.btn-sm{height:26px;padding:0 9px;font-size:12px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:4px;font-size:12px;background:var(--green-soft);color:var(--green-press);margin:0 4px 2px 0;white-space:nowrap}
.tag.gray{background:#f5f5f4;color:#57534e}.tag.amber{background:var(--amber-bg);color:var(--amber)}.tag.blue{background:var(--blue-bg);color:var(--blue)}.tag.red{background:var(--danger-bg);color:var(--danger)}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card-h{font-weight:600;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}.card-h .hint{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
.banner{border-radius:8px;padding:9px 14px;margin-bottom:10px;line-height:1.55}
.banner.err{color:var(--danger);background:var(--danger-bg)}.banner.ok{color:var(--ok);background:var(--ok-bg)}.banner.gray{color:#57534e;background:#fafaf9;border:1px dashed #d6d3d1}
.banner.amber{color:var(--amber);background:var(--amber-bg);border:1px solid #fde68a}.banner.blue{color:var(--blue);background:var(--blue-bg);border:1px solid #bfdbfe}
.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{border-bottom:1px solid var(--border);padding:10px 10px;text-align:left;vertical-align:middle}
.table th{background:#fafaf9;color:#57534e;font-weight:600;font-size:12px;white-space:nowrap}.table tr.pick{cursor:pointer;transition:background .12s}.table tr.pick:hover td{background:#f8fafc}.table tr.sel td{background:var(--green-soft)}
.form-row{display:grid;grid-template-columns:168px 1fr;gap:10px;margin-bottom:10px;align-items:start}.form-row>label{color:var(--muted);padding-top:6px}.req{color:var(--danger);margin-left:2px}
.input,.select,textarea.input{border:1px solid var(--border);border-radius:8px;padding:5px 9px;background:#fff;width:100%;min-height:32px}textarea.input{min-height:60px;resize:vertical}
.help{font-size:12px;color:var(--muted);margin-top:3px}.err{font-size:12px;color:var(--danger);margin-top:3px}
.kv{display:grid;grid-template-columns:132px 1fr;gap:7px 12px}.kv .k{color:var(--muted)}
.checks{display:flex;gap:12px;flex-wrap:wrap;padding-top:6px}.checks label{display:inline-flex;gap:5px;align-items:center}
svg.map{width:100%;height:auto;border:1px solid var(--border);border-radius:8px;background:#fff;display:block}svg.map.click{cursor:crosshair}svg.map.small{max-width:260px}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.38);display:flex;align-items:flex-start;justify-content:center;padding-top:90px;z-index:80}
.dialog{width:520px;background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 20px 40px rgba(0,0,0,.18)}.dialog h3{font-size:16px;margin-bottom:8px}.dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.dialog.wide{width:min(960px,calc(100vw - 48px));max-height:calc(100vh - 120px);overflow:auto}
.stepper{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}.step-btn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 16px;font-weight:600}.step-btn.on{background:var(--green);color:#fff;border-color:var(--green)}.arr{color:var(--muted)}
.step-nav{display:flex;justify-content:space-between;gap:8px;margin:14px 0}
.wb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.wb .card{margin:0;padding:12px 14px;transition:border-color .15s,box-shadow .15s}.wb .card.clickable{cursor:pointer}.wb .card.clickable:hover{border-color:var(--green);box-shadow:0 3px 10px rgba(31,107,86,.10)}
.wb-kpi{font-size:22px;font-weight:700;color:var(--green-press);margin:3px 0;display:flex;align-items:baseline;gap:6px}.wb-kpi.amber{color:var(--amber)}.wb-kpi.blue{color:var(--blue)}
.nav-sec{font-size:11px;font-weight:600;color:var(--muted);padding:10px 10px 4px;margin-top:8px;border-top:1px dashed var(--border);letter-spacing:.5px}
.nav-item.planned{color:#57534e;font-size:12px;padding:7px 10px}.nav-item.planned .plan-tag{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;border-radius:4px;padding:0 5px;font-size:10px;white-space:nowrap}
.ctx-bar{background:linear-gradient(90deg,#e8f2ee 0%,#f8fafc 100%);border:1px solid #b7d7c8;border-radius:10px;padding:8px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ctx-bar.existing{background:linear-gradient(90deg,#eff6ff 0%,#f8fafc 100%);border-color:#93c5fd}
.role-chip{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);color:var(--green-press);border:1px solid #b7d7c8;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.role-chip.leader{background:var(--blue-bg);color:var(--blue);border-color:#bfdbfe}
.role-chip.supervision{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar{gap:10px}
.global-search{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #d6d3d1;border-radius:8px;padding:2px 8px 2px 10px;height:32px}
.global-search input{border:none;outline:none;background:transparent;width:168px;font-size:12px;color:#1c1917;min-width:0}

.global-search .gs-btn{border:none;background:var(--green-soft);color:var(--green-press);border-radius:6px;height:24px;padding:0 8px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.global-search .gs-btn:hover{background:#d8ebe2}
.admin-toggle{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#57534e;white-space:nowrap}

.top-nav{display:flex;align-items:center;gap:2px;margin-left:8px;flex:1;min-width:0;overflow-x:auto;padding:0 4px}
.top-nav-item{border:none;background:transparent;color:#44403c;padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;height:32px;cursor:pointer;line-height:1.2}
.top-nav-item:hover{background:#f5f5f4;color:var(--green-press)}
.top-nav-item.on{background:var(--green-soft);color:var(--green-press);font-weight:650}
.top-nav-item.planned{color:#57534e;font-size:12px}
.top-nav-item.planned .plan-tag,.nav-item.planned .plan-tag{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;border-radius:4px;padding:0 5px;font-size:10px;white-space:nowrap}
.top-nav-item.planned.on{background:#f1f5f9;color:#334155}
.sidenav-sec{font-size:11px;font-weight:600;color:var(--muted);padding:2px 10px 8px;letter-spacing:.3px}
.sidenav-hint{margin:4px 6px;padding:10px 12px;font-size:12px;line-height:1.55;color:#57534e;background:#fafaf9;border:1px dashed #d6d3d1;border-radius:8px}
#wsBoard{scroll-margin-top:12px}
.dup-h{font-weight:650;margin:0 0 6px;color:var(--green-press)}.dup-box{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.tabs button{border:1px solid var(--border);background:#fff;border-radius:8px;height:30px;padding:0 12px;font-size:12px;font-weight:500}.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.step{display:flex;gap:6px;align-items:center;margin-bottom:5px}.step .btn{flex:1;justify-content:flex-start;white-space:normal;height:auto;min-height:28px;padding:4px 9px;text-align:left}.step .done{color:var(--ok);width:14px}
.small{font-size:12px;color:var(--muted)}
.trail div{border-bottom:1px dashed #e7e5e4;padding:5px 0;font-size:12px}.trail .t{color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.note{border-left:3px solid #94a3b8;padding:2px 10px;color:#475569;font-size:12px;margin:8px 0}
/* 右侧滑出式详情抽屉（Slide-over Drawer） */
.drawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.32);z-index:70;display:flex;justify-content:flex-end}
.drawer-panel{width:740px;max-width:92vw;height:100vh;background:#fff;box-shadow:-12px 0 36px rgba(15,23,42,.18);display:flex;flex-direction:column;overflow:hidden}
.drawer-head{padding:14px 20px;border-bottom:1px solid var(--border);background:#fafaf9;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0}
.drawer-tabs{display:flex;gap:4px;padding:0 20px;background:#fafaf9;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-tab{padding:10px 14px;font-size:13px;font-weight:600;color:#57534e;border:none;border-bottom:2.5px solid transparent;background:transparent;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.drawer-tab:hover{color:var(--green-press)}
.drawer-tab.on{color:var(--green-press);border-bottom-color:var(--green);background:#fff;border-radius:8px 8px 0 0}
.drawer-tab .badge{padding:0 6px;border-radius:999px;font-size:11px;font-weight:600}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px 32px;background:#fff}
.sec-title{font-size:13px;font-weight:650;color:#1c1917;padding-bottom:6px;margin:14px 0 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sec-title:first-child{margin-top:0}
.timeline{position:relative;padding-left:18px;border-left:2px solid #cbd5e1;margin-left:8px}
.timeline-item{position:relative;padding:0 0 14px 12px}
.timeline-item::before{content:"";position:absolute;left:-23px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--green);border:2px solid #fff;box-shadow:0 0 0 1px var(--green)}
</style>

<script>
'use strict';
/* 纯模型 Model 与统一工作台、线索中心交互视图（遵循 GLOSSARY.md 标准业务术语） */
const Model = (() => {
  const THRESHOLD = 0.6; // 60%：上线初始版本写定 60%，配置项归管理台第二期（Lei Hu 2026-10-23 拍板）

  const S = (c, n, g, lv = 1) => ({ c, n, g, lv });
  const SOURCES = [ // 线索来源编码表（ 定案；304/802/803/21 及违法类型编码统一按违法类型清单，Lei Hu 2026-10-23 拍板）
    S('1','主动发现','1',0), S('102','卫片执法','1'), S('16','日常巡查','1'), S('13','专项排查','1'),
    S('1301','乱占耕地建房问题整治','1',2), S('1302','耕地占补平衡问题','1',2), S('1303','废弃矿洞排查封堵整治','1',2), S('1304','殡葬用地整治','1',2), S('1305','个人买地建房','1',2),
    S('5','上级交办','5',0), S('501','部级交办','5'), S('502','省级交办','5'), S('503','市级交办','5'),
    S('22','部门移送','22',0), S('2201','公安机关移送','22'), S('2202','检察机关移送','22'), S('18','司法移送','22'), S('19','行政执法移送','22'), S('20','纪检监察移送','22'),
    S('801','行政督查','22'), S('802','机构检测报告','22'), S('803','行政检查（含日常检查和专项检查）属于双随机的','22'), S('2203','其他行政主管部门移送','22'),
    S('3','群众举报','3',0), S('301','举报','3'), S('302','投诉','3'), S('303','曝光','3'), S('304','信访','3'), S('305','电话举报','3'), S('306','线索征集平台','3'),
    S('21','舆情监测','21',0)];
  const sourceOf = c => SOURCES.find(x => x.c === c);

  const DOMAINS = { // 一条线索一个法域；土地、矿产＝面，测绘、规划＝点（契约 §3.7，业务口径）；只有土地、矿产有内业核查
    land: { n: '土地', geom: 'polygon', check: true }, mineral: { n: '矿产', geom: 'polygon', check: true },
    survey: { n: '测绘地理信息', geom: 'point', check: false }, planning: { n: '国土空间规划', geom: 'point', check: false } };

  // 违法类型编码与名称： 定稿（docs/research/violation-type-codes.md）。要件：[键, 名称, 缺件后果, 录入时必填, 控件, 选项]
  const OPT = {
    landClass: ['耕地-水田', '耕地-旱地', '园地', '林地', '草地', '建设用地', '未利用地'],
    yesNoCheck: ['是', '否', '待核实'],
    illegalUse: ['未批先建', '少批多占', '非法占用耕地建窑', '非法占用耕地建坟', '非法占用耕地建房', '非法占用耕地挖砂', '非法占用耕地采石', '非法占用耕地采矿', '非法占用耕地取土', '堆放固体废弃物'],
    currentUse: ['仓储', '厂房', '住宅', '道路', '堆场', '其他'],
    damageForm: ['破坏种植条件', '挖塘养鱼', '建窑', '建坟', '取土', '堆放固体废弃物', '其他'],
    buildingForm: ['构筑物', '临时建筑', '永久性建筑', '无建筑物'],
    mineralKind: ['花岗岩', '建筑用砂', '砖瓦用页岩', '石灰岩', '高岭土', '地热', '矿泉水', '其他'],
    miningMethod: ['露天开采', '地下开采', '河道采砂', '其他'],
    licenseStatus: ['无证开采', '持证越界开采', '许可证过期继续开采'],
    mapType: ['互联网地图服务', '公开出版地图', '导航电子地图', '地理信息系统工程', '测绘航空摄影', '涉密测绘成果'],
    surveySituation: ['未依法送审地图/问题地图', '无测绘资质', '超越资质等级', '非法获取涉密测绘成果', '非法提供涉密测绘成果'],
    secretLevel: ['不涉密', '内部', '秘密', '机密', '定密核实中'],
    planZone: ['城镇开发边界内', '城镇开发边界外', '生态保护红线', '历史文化街区', '乡村建设规划区'],
    planPermit: ['未取得建设工程规划许可证', '未按建设工程规划许可证规定建设', '未取得乡村建设规划许可证', '未按乡村建设规划许可证建设', '临时建设逾期未拆除'],
    subjectType: ['自然人', '法人或其他组织', '待核实'],
    reportMode: ['实名举报', '匿名举报'],
    issueLevel: ['部级', '省级', '市级'],
    transferLevel: ['部级', '省级', '市级', '区级', '其他部门'],
    urgency: ['普通', '紧急', '特急'],
    satBatch: ['2026年第1期', '2026年第2期', '2026年第3期', '2026年第4期'],
    opinionSource: ['网站', '客户端', '社交媒体', '传统媒体'] };
  const it = (k, label, cons, req, w, opts) => [k, label, cons, req, w, opts];
  const TYPES = [
    { c: 'land_occupy_without_approval', n: '未经批准或者采取欺骗手段骗取批准，违法占用土地', d: 'land', items: [
      it('occupied_area', '占用面积（亩）', '阻断', true, 'number'), it('land_class', '占用地类', '警告', true, 'checks', OPT.landClass),
      it('permanent_farmland', '是否占用永久基本农田', '警告', true, 'radio', OPT.yesNoCheck), it('illegal_use', '违法用地类型', '提示', false, 'select', OPT.illegalUse),
      it('current_use', '现状用途', '提示', false, 'select', OPT.currentUse)] },
    { c: 'land_farmland_permanent', n: '破坏永久基本农田行为', d: 'land', items: [
      it('damage_form', '破坏方式', '阻断', true, 'select', OPT.damageForm), it('damaged_area', '破坏面积（亩）', '警告', true, 'number'),
      it('building_form', '建筑物形态', '提示', false, 'select', OPT.buildingForm)] },
    { c: 'land_other', n: '附录外其他', d: 'land', items: [] },
    { c: 'mineral_mine_without_license', n: '无证采矿', d: 'mineral', items: [
      it('mineral_kind', '涉案矿种', '阻断', true, 'select', OPT.mineralKind), it('mining_method', '开采方式', '警告', true, 'radio', OPT.miningMethod),
      it('license_status', '采矿权证情况', '警告', true, 'radio', OPT.licenseStatus)] },
    { c: 'mineral_mine_overstep', n: '越界采矿', d: 'mineral', items: [

function sourceStdLabel(l) {
  const c = l.sourceCode;
  if (c === '102' || c === '1301' || (l.tags || []).some(t => t.includes('卫片'))) return '102 卫片执法（' + srcN(c) + '）';
  if (c === '304' || (M.sourceOf(c) && M.sourceOf(c).g === '3')) return '304 信访举报（' + srcN(c) + '）';
  if (c === '802') return '802 机构检测报告';
  if (c === '803') return '803 双随机行政检查';
  if (c === '21') return '21 舆情监测';
  const s = M.sourceOf(c);
  if (s && (s.g === '5' || s.g === '22')) return '上级交办与部门移送（' + srcN(c) + '）';
  return srcN(c);
}

function matchSourceFilter(l, f) {
  if (!f) return true;
  const c = l.sourceCode, s = M.sourceOf(c);
  if (f === '102') return c === '102' || c === '1301' || (l.tags || []).some(t => t.includes('卫片'));
  if (f === '304') return c === '304' || !!(s && s.g === '3');
  if (f === '802') return c === '802';
  if (f === '803') return c === '803';
  if (f === '21') return c === '21' || !!(s && s.g === '21');
  if (f === '5_22') return !!(s && (s.g === '5' || s.g === '22'));
  return c === f || !!(s && s.g === f);
}

function matchCheckFilter(l, f) {
  if (!f) return true;
  if (f === 'exempt') return !M.DOMAINS[l.domain].check;
  return M.DOMAINS[l.domain].check && l.check === f;
}

function checkStatusTag(l) {
  if (!M.DOMAINS[l.domain].check) return '<span class="tag gray" title="测绘/规划点状线索免跑内业核查与空间重合比对">点状线索免跑</span>';
  if (l.check === 'done') return '<span class="tag">核查完成</span>';
  if (l.check === 'running') return '<span class="tag blue">核查进行中</span>';
  if (l.check === 'failed') return '<span class="tag amber">核查没跑成（待重跑）</span>';
  return '<span class="tag">核查完成</span>';
}

function statusStdTag(l) {
  const txt = STATUS_STD_LABEL[l.status] || STATUS[l.status] || l.status;
  const cls = l.status === 'decide' || l.status === 'pool' || l.status === 'org-set' ? 'amber' : l.status === 'held' ? 'blue' : M.isClosed(l) ? 'gray' : '';
  return `<span class="tag ${cls}">${esc(txt)}</span>`;
}

function filterLeadsForCenter() {
  const a = actor();
  let vis = state.leads.filter(l => a.org === 'sj' || a.role === '监督' || [l.enteredOrg, l.poolOrg, l.handlerOrg].some(o => o && M.scope(a.org).includes(o)) || l.enteredBy === state.actorId);
  if (ui.fDomain) vis = vis.filter(l => l.domain === ui.fDomain);
  if (ui.fSource) vis = vis.filter(l => matchSourceFilter(l, ui.fSource));
  if (ui.fOrg) vis = vis.filter(l => [l.handlerOrg, l.poolOrg, l.enteredOrg].includes(ui.fOrg));
  if (ui.fStatus) {
    if (ui.fStatus === 'handling') vis = vis.filter(l => l.status === 'handling' || l.status === 'assigned');
    else vis = vis.filter(l => l.status === ui.fStatus);
  }
  if (ui.fCheck) vis = vis.filter(l => matchCheckFilter(l, ui.fCheck));
  if (ui.fGap === 'has_gap') vis = vis.filter(l => l.gaps && l.gaps.length > 0);
  else if (ui.fGap === 'no_gap') vis = vis.filter(l => !l.gaps || l.gaps.length === 0);
  const q = (ui.q || '').trim().toLowerCase();
  if (q) {
    vis = vis.filter(l => {
      const locStr = M.locate(l.geometry).map(x => x.cell.d + x.cell.n).join(' ');
      return [l.id, l.serial, l.title, l.subjectName, l.partyRep, locStr, sourceStdLabel(l), domainN(l), orgN(l.handlerOrg), orgN(l.poolOrg), STATUS_STD_LABEL[l.status]].join(' ').toLowerCase().includes(q);
    });
  }
  return [...vis].reverse();
}

function detail(l) {

    }

    repHtml = `<span class="tag gray">匿名或非举报来源</span> <span class="small">（不涉及实名举报人或按对称脱敏规则隐藏）</span>`;

    if (g.w === 'select' || (g.opts && g.opts.length)) {
