<!DOCTYPE html>
<!--
  管理台 HTML 样板 v0.4 · P7 被锁人员列表（解锁、重设初始口令）
  对应 issue：#91「管理员动作」一节与用户故事 44–53；#91 维护者定案评论（2026-10-16 第 2 条）：列表字段为人员标识、工号、姓名、当前机构名、自动解锁时间，不含手机号与执法证号；对方没有当前任职时机构名显示为空，只有根机构上的系统管理人员能看到；#84「文案已定案，不可改；这里只定布局与操作流」；#79 第 4 问。
  本页列名逐字取 #91 字段名，不增不减，不含手机号。操作的成功与被拒文案 #91 未给出，属设计假设（README A7）；v0.4：35 条已由 Lei Hu 整体定稿（#105 7-6），只改第 17、27、28 条；重设成功、重设被拒、口令历史提示为 v0.4 新增、待定稿。
  许可（已定名）：列表 personnel.locked.read；解锁 personnel.locked.release；重设初始口令 personnel.password.reset。被拒原因对应 scope-denied / permission-denied，原文只在 data- 属性里。
  「刷新」只放手动按钮：v0.2 起标为待定假设（README A15）。#91 的「不轮询」只针对会话查询，不覆盖本列表，v0.1 的引用超出原文。
  参照：S01 表格密度；login.css 琥珀色锁定横幅色值。
  状态：?state=data|empty|unlockConfirm|resetConfirm|success|resetSuccess|scopeDenied|selfDenied|resetDenied|loading|error|denied（resetDenied 另带 &case=self 或 &case=reused）
-->
<html lang="zh-CN"><head><meta charset="utf-8"><title>P7</title><link rel="stylesheet" href="assets/admin.css"><script src="assets/shell.js"></script></head><body><script>
var S=NE.SESSIONS;
var C=new URLSearchParams(location.search).get('case')||'';
var ROWS=[
 ['01K7DQ4M2X8VJ3N6T9C1R5W0EA','TH0331','王芳','龙洞自然资源所','2026-10-17 10:21'],
 ['01K7DQ9B5H2KZ7P4F8S3M6Y1GD','HZ0217','张敏','海珠区分局','2026-10-17 10:34'],
 ['01K7DR1C8N4QW6J2V5X9T3B7HK','SJ0001','周敏','广州市规划和自然资源局','2026-10-17 10:40'],
 ['01K7DR3F6T9MB2R8K4Z1C5N7PS','PY0042','陈立','','2026-10-17 10:47']];
function table(rows,mark){
  return '<table class="table" data-fields="人员标识 工号 姓名 当前机构名 自动解锁时间"><tr><th>人员标识</th><th>工号</th><th>姓名</th><th>当前机构名</th><th>自动解锁时间</th><th style="width:210px"></th></tr>'+rows.map(function(r,i){
   return '<tr'+(mark===i?' style="background:#fffaeb"':'')+'><td class="mono">'+r[0]+'</td><td class="mono">'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td><div class="actions"><button class="btn btn-sm" data-requires="personnel.locked.release">解锁</button><button class="btn btn-sm btn-ghost-danger" data-requires="personnel.password.reset">重设初始口令</button></div></td></tr>';}).join('')+'</table>';
}
NE.mount({title:'P7 被锁人员', active:'locked', states:{
  data:{label:'有数据'}, empty:{label:'空'}, unlockConfirm:{label:'解锁确认'}, resetConfirm:{label:'重设确认'}, success:{label:'操作成功'}, resetSuccess:{label:'重设成功'}, scopeDenied:{label:'被拒：超出范围'}, selfDenied:{label:'被拒：对自己操作'}, resetDenied:{label:'重设被拒'}, loading:{label:'加载中'}, error:{label:'加载失败'}, denied:{label:'权限不足（监督）'}},
 render:function(k){
  var s=S.cityAdmin;
  var head='<div class="crumb">管理台 / <b>被锁人员</b></div><div class="page-h"><div><h1>被锁人员</h1><div class="desc">你任职机构及其下级中，当前处于锁定期的人员。连续输错口令 5 次会锁定 30 分钟，到时自动解锁。</div></div><div class="actions"><button class="btn">刷新</button></div></div>';
  if(k==='denied') return {session:S.supervisor, html:'<div class="crumb">管理台 / <b>被锁人员</b></div>'+NE.deniedCard('被锁人员')};
  if(k==='loading') return {session:s, html:head+NE.skelRows(5)};
  if(k==='error') return {session:s, html:head+NE.errorCard('被锁人员')};
  if(k==='empty') return {session:s, html:head+'<div class="card"><div class="empty"><div class="t">当前没有被锁的人员</div><div>有人来电说登录不了时，可先刷新本页确认是否被锁。</div></div></div>'};
  var rows=ROWS, banner='', ov='', mark=-1;
  if(k==='success'){ rows=ROWS.slice(1); banner='<div class="banner ok">已解锁「王芳」（TH0331），对方现在可以登录。</div>'; }
  if(k==='scopeDenied'){ banner='<div class="banner danger" data-reason="scope-denied">没有解锁「张敏」（HZ0217）：对方已不在你的数据范围内，可能刚刚调岗。请刷新列表，或联系对方现在所在单位的系统管理人员。</div>'; mark=1; }
  if(k==='selfDenied'){ banner='<div class="banner danger" data-reason="permission-denied">不能解锁自己，也不能给自己重设口令。请联系本单位其他系统管理人员处理。</div>'; mark=2; }
  if(k==='resetSuccess'){ rows=ROWS.slice(1); banner='<div class="banner ok">已为「王芳」（TH0331）重设初始口令，并已解锁。对方的全部会话和全部「记住我」已结束，下次登录须先改口令。</div>'; }
  if(k==='resetDenied'){ if(C==='self'){ banner='<div class="banner danger" data-reason="permission-denied">不能解锁自己，也不能给自己重设口令。请联系本单位其他系统管理人员处理。</div>'; mark=2; } else if(C==='reused'){ mark=0; } else { banner='<div class="banner danger" data-reason="scope-denied">没有为「张敏」（HZ0217）重设初始口令：对方已不在你的数据范围内，可能刚刚调岗。请刷新列表，或联系对方现在所在单位的系统管理人员。</div>'; mark=1; } }
  if(k==='unlockConfirm') ov=NE.dialog('解锁「王芳」？','<div class="kv"><div class="k">工号</div><div class="mono">TH0331</div><div class="k">当前机构名</div><div>龙洞自然资源所</div><div class="k">自动解锁时间</div><div>2026-10-17 10:21</div></div><p style="margin-top:10px">解锁后对方可以立即用原口令登录。请先核实来电人确是本人。</p>','<button class="btn">取消</button><button class="btn btn-primary">确认解锁</button>');
  if(k==='resetConfirm'||(k==='resetDenied'&&C==='reused')) ov=NE.dialog('为「王芳」重设初始口令','<div class="kv" style="margin-bottom:12px"><div class="k">工号</div><div class="mono">TH0331</div><div class="k">当前机构名</div><div>龙洞自然资源所</div></div><div class="form-row"><label>新的初始口令<span class="req">*</span></label><div><input class="input" placeholder="请输入新的初始口令"'+(k==='resetDenied'?' value="Gz@Field2026"':'')+'>'+(k==='resetDenied'?'<div class="err" data-reason="unavailable">此口令不可用，请换一个。</div>':'')+'<div class="help">至少 10 位，最多 64 位；大写、小写、数字、特殊字符中至少 3 类；不能包含对方工号；不能有 4 位及以上连续或重复字符；不能用常见弱口令；不能与对方最近 5 次使用过的口令相同。</div></div></div><p>确认后：同时解锁；对方的全部会话都会结束，同时结束全部「记住我」；对方下次登录必须先改口令。</p>','<button class="btn">取消</button><button class="btn btn-danger">确认重设</button>');
  return {session:s, html:head+banner+'<div class="card"><div class="card-h">共 '+rows.length+' 人<span class="hint">当前机构名为空的人员没有任职机构，只有市局的系统管理人员能看到和处理</span></div>'+table(rows,mark)+'</div>', overlay:ov};
 }});
</script></body></html>
