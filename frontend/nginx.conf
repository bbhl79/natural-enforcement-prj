# 前端容器的站点配置（#122，#91 约定第 5 条）：未知路径回落到 index.html，
# 由前端路由显示对应页面或 404。真实静态资源与健康快照目录不回落，缺失时照常 404。
server {
  listen 80;
  listen [::]:80;
  server_name localhost;
  root /usr/share/nginx/html;

  # 构建产物：缺失即 404，避免把 index.html 当成脚本返回
  location /assets/ {
    try_files $uri =404;
  }

  # 健康快照（compose 命名卷挂在 /usr/share/nginx/html/health）
  location /health/ {
    try_files $uri =404;
  }

  # 页面路径一律回落到入口页；入口页不缓存，发版后刷新即取到新资源
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
