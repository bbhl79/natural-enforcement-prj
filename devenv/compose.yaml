# PROTOTYPE（#11）— compose 拓扑：基础设施 + api + tools。
# 人类/agent 禁止直接操作本文件对应的 compose 命令（地图硬不变量：devenv 唯一入口）。
# 镜像引用一律经 ${XXX_IMAGE} 变量注入，事实源：devenv/images.lock（tag+digest 双层锁）。
# 运行时是 podman machine（bind mount 不可用）→ workspace 代码烘焙进镜像（devenv/workspace.Dockerfile），
# compose 只挂命名卷（turbo 缓存），无任何宿主路径依赖。
# 不发布任何宿主端口：所有访问走 compose 内网（多 agent 并发下天然零端口冲突）。
name: natural-enforcement

x-app-base: &app-base
  image: ${WORKSPACE_IMAGE:?devenv 需注入 WORKSPACE_IMAGE（devenv build 产出）}
  working_dir: /workspace
  # 以镜像默认 root 运行：镜像内容物为 buildah root 属主，uid 化容器对 dist/日志等
  # 全线 EACCES（实测 #11）；dev 单机场景无安全边界损失，卷内容不回宿主。
  environment: &app-env
    HOME: /tmp
    NODE_ENV: development
    TURBO_TELEMETRY_DISABLED: "1"
    # turbo 默认日志目录在镜像 root 属主层内不可写（uid 化容器）——指到容器 tmpfs
    TURBO_LOG_DIR: /tmp/turbo-logs
    DATABASE_URL: postgresql://ne:ne-dev-only@db:5432/natural_enforcement_dev
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://rustfs:9000
    S3_REGION: us-east-1
    S3_ACCESS_KEY: rustfsadmin
    S3_SECRET_KEY: rustfs-dev-secret
    S3_BUCKET: ne-dev-evidence
  volumes:
    - turbo-cache:/workspace/.turbo

services:
  db:
    image: ${DB_IMAGE:?images.lock 未加载（devenv 会自动 source）}
    environment:
      POSTGRES_USER: ne
      POSTGRES_PASSWORD: ne-dev-only
      POSTGRES_DB: natural_enforcement_dev
    volumes:
      # PG18+ 官方约定：挂父目录 /var/lib/postgresql（data 落版本子目录，pg_upgrade 免挂载点边界问题）
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ne -d natural_enforcement_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:?}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rustfs:
    image: ${RUSTFS_IMAGE:?}
    # 数据目录以位置参数传入（官方约定）；named volume 规避非 root UID 10001 的 chown 问题
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfs-dev-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    mem_limit: 1g   # 单节点内存增长 issue #9145 的缓解（调研报告 R2）
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    <<: *app-base
    command: ["pnpm", "--filter", "@ne/api", "start"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # 工具容器：仅经 `docker compose run --rm` 被 devenv 驱动（test/lint/migrate/seed/exec/shell）
  tools:
    <<: *app-base
    profiles: ["tools"]
    command: ["true"]

  # 前端（#12）：vite preview 供镜像烘焙产物；api 调用经 preview proxy 走容器内网。
  # profile 隔离：`devenv up` 不启动 web（保持零宿主端口）；人类经 `devenv web` 显式 opt-in 发布端口
  # ——这是"零宿主端口"不变量的唯一例外（浏览器在宿主机，无法走容器内网）。
  web:
    <<: *app-base
    profiles: ["web"]
    command: ["pnpm", "--filter", "@ne/web", "run", "preview"]
    ports:
      - "${WEB_PORT:-5173}:4173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  rustfs-data:
  turbo-cache:
