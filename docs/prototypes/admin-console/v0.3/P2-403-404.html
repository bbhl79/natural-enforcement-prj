<!DOCTYPE html>
<!--
  管理台 HTML 样板 v0.3 · P2 无权限页（403）与找不到页（404）
  对应 issue：#79（应用壳与前端守卫）上的 #91 约束评论（页面路径 /auth/login、/auth/password、/；403 强制改密跳改口令页；不存在的路径回落 index.html 后由前端显示 404）；#91「页面路径约定」。
  参照：login.css 横幅与配色；PasswordPage.tsx 的首登/到期说明文案（原样引用）。
  状态：?state=forbidden|notfound|forced|forcedExpired
-->
<html lang="zh-CN"><head><meta charset="utf-8"><title>P2</title><link rel="stylesheet" href="assets/admin.css"><script src="assets/shell.js"></script></head><body><script>
var S=NE.SESSIONS;
NE.mount({title:'P2 无权限与找不到', active:'', states:{
  forbidden:{label:'无权限（被拒）'}, notfound:{label:'找不到页面'}, forced:{label:'强制改密时被跳转（首登）'}, forcedExpired:{label:'强制改密时被跳转（到期）'}},
 render:function(k){
  if(k==='forbidden') return {session:S.handler, html:'<div class="center-page"><div class="center-box" data-http="403"><div class="code">403</div><h2>你没有权限打开这个页面</h2><p>这个页面需要的权限不在你当前的角色里。如工作需要，请联系本单位的系统管理人员调整角色。</p><a class="btn btn-primary" href="P1-shell.html">回到工作台</a></div></div>'};
  if(k==='notfound') return {session:S.handler, html:'<div class="center-page"><div class="center-box" data-http="404"><div class="code">404</div><h2>没有找到这个页面</h2><p>地址可能输错了，或页面已经调整。请从左侧导航进入。</p><a class="btn btn-primary" href="P1-shell.html">回到工作台</a></div></div>'};
  var ex = k==='forcedExpired' ? '口令已超过 90 天，必须更换口令。完成前不能使用其他功能。' : '首次登录必须更换初始口令。完成前不能使用其他功能。';
  return {session:null, bare:true, html:'<div class="center-page"><div class="center-box" style="text-align:left;width:400px" data-route="/auth/password?next=/admin/personnel"><h2>必须改口令</h2><div class="banner amber">你要打开的页面需要先完成改口令。改好后会自动回到刚才的页面。</div><p>'+ex+'</p>'+
   '<input class="input" placeholder="当前口令" type="password" style="margin-bottom:10px;height:44px"><input class="input" placeholder="新口令" type="password" style="margin-bottom:14px;height:44px"><button class="btn btn-primary" style="width:100%;height:44px;justify-content:center" disabled>更换口令</button><div style="margin-top:10px"><button class="link-btn">退出</button></div></div></div>'};
 }});
</script></body></html>
