<!DOCTYPE html>
<!--
  管理台 HTML 样板 v0.3 · P3 管理台首屏
  对应 issue：#79 第 2 问（首屏入口）；#84（首屏与维护交互原型）；#86（监督评查只有审计入口，不能打开人员主数据）；#80（不展示密钥、运行参数、连通状态）；#87（配置类对象一期不做，只画占位）；wayfinder 3.3 D5（生产首日只有根机构与首个系统管理人员）。
  参照：S01-workbench 卡片与横幅；login.css 配色。
  状态：?state=admin|supervise|firstday|loading|error|denied
-->
<html lang="zh-CN"><head><meta charset="utf-8"><title>P3</title><link rel="stylesheet" href="assets/admin.css"><script src="assets/shell.js"></script></head><body><script>
var S=NE.SESSIONS;
function tile(t,d,n,href,req){ return '<a class="tile" href="'+href+'" data-requires="'+req+'"><div class="t">'+t+'</div><div class="d">'+d+'</div><div class="n">'+n+'</div></a>'; }
NE.mount({title:'P3 管理台首屏', active:'admin', states:{
  admin:{label:'系统管理视角'}, supervise:{label:'监督视角（只有留痕）'}, firstday:{label:'条件未齐（上线首日）'}, loading:{label:'加载中'}, error:{label:'加载失败'}, denied:{label:'权限不足'}},
 render:function(k){
  var head='<div class="crumb">管理台 / <b>首页</b></div><div class="page-h"><div><h1>管理台</h1><div class="desc">维护机构、人员和执法证，处理被锁人员，查阅管理台留痕。范围限于你任职机构及其下级。</div></div></div>';
  if(k==='loading') return {html:head+'<div class="tiles">'+[1,2,3,4].map(function(){return '<div class="tile"><div class="skel"></div><div class="skel" style="width:50%"></div></div>';}).join('')+'</div>'};
  if(k==='error') return {html:head+NE.errorCard('管理台首页')};
  if(k==='denied') return {session:S.handler, html:'<div class="crumb">管理台 / <b>首页</b></div>'+NE.deniedCard('管理台')};
  if(k==='supervise') return {session:S.supervisor, html:head.replace('维护机构、人员和执法证，处理被锁人员，查阅管理台留痕。','你可以查阅和导出管理台留痕。')+
    '<div class="tiles">'+tile('管理台留痕','谁在什么时候做了哪些维护，结果如何','今日 12 条','P8-admin-audit.html?state=supervise','audit.admin.read')+'</div>'+
    '<div class="banner gray" style="margin-top:12px">监督只查阅留痕，不能打开人员名单和人员详情，也不能导出人员资料。</div>'};
  var first = k==='firstday';
  var h=head;
  if(first) h+='<div class="banner amber"><b>还不能开始核查和立案：</b>目前只有市局一个机构，除你以外没有其他人员，也没有人登记执法证。请按顺序完成：① 在「机构」里建区分局和所；② 在「人员」里建人员并分配角色；③ 为经办人员登记执法证。<br>没有有效执法证的人员可以登录，但不能启动核查、不能立案。</div>';
  h+='<div class="tiles">'+
    tile('机构','建下级机构、改名、停用', first?'1 个':'38 个','P4-org-tree.html','org.tree.read')+
    tile('人员','建人员、分配角色、调岗、停用与恢复', first?'1 人':'412 人','P5-personnel-list.html','personnel.read')+
    tile('被锁人员','连续输错口令被锁的人员', first?'0 人':'3 人','P7-locked-personnel.html','personnel.locked.read')+
    tile('管理台留痕','查阅与导出维护记录', first?'2 条':'今日 46 条','P8-admin-audit.html','audit.admin.read')+'</div>';
  if(!first) h+='<div class="grid2" style="margin-top:12px"><div class="card"><div class="card-h">需要留意的执法证<span class="hint">本范围内</span></div><table class="table"><tr><th>情况</th><th>人数</th><th></th></tr>'+
    '<tr><td>30 天内到期</td><td>5</td><td><a class="btn btn-sm" href="P5-personnel-list.html?state=filtered">查看</a></td></tr><tr><td>已过期</td><td>2</td><td><a class="btn btn-sm" href="#">查看</a></td></tr><tr><td>暂扣</td><td>1</td><td><a class="btn btn-sm" href="#">查看</a></td></tr><tr><td>未登记</td><td>9</td><td><a class="btn btn-sm" href="#">查看</a></td></tr></table></div>'+
    '<div class="card"><div class="card-h">后续开放</div><div style="color:var(--muted);font-size:12px;line-height:1.8">文书模板、校验规则、工作日历、统计口径的维护，待对应业务功能上线后在此开放。</div></div></div>';
  return {session:S.cityAdmin, html:h};
 }});
</script></body></html>
