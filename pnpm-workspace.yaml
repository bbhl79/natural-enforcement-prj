# pnpm workspaces：包发现 + catalogs（第三方版本唯一事实源）
# 注：不声明 pnpm tasks（运行期命令走 pnpm -r 直跑、构建期走 turbo——原型 NOTES 实测）
packages:
  - apps/*
  - packages/*

# pnpm 12 供应链防护·新包冷却期（分钟单位；只认此处的 camelCase 键，npmrc 无效，原型 #11 实测）。
# pnpm 12.21 真实语义（#63 在锁定 tools 镜像内核实并实测 589 条解析全绿）：
#   - 值单位是分钟；1440 = 1 天冷却（SPEC 提案）。
#   - 显式配置 minimumReleaseAge 时 minimumReleaseAgeStrict 默认 true；这里显式写出，
#     太新的版本会以 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION 失败并要求审查，
#     而不是静默写入 minimumReleaseAgeExclude。
#   - 例外只允许精确 pkg@version（紧急安全更新流程见 docs/agents/supply-chain.md）。
#   - minimumReleaseAgeIgnoreMissingTime 保持 false：缺发布时间不得静默跳过。
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# pnpm 12 供应链防护·构建脚本审批：键是 allowBuilds 且**必须带版本号**（裸包名不匹配，
# 原型 #11 实测；onlyBuiltDependencies/ignoredBuiltDependencies 在 12.21 不生效）。
# 版本变更 → 此处需同步显式批准 = 强制人工/agent 审查点。
allowBuilds:
  prisma@7.10.1: true
  "@prisma/engines@7.10.1": true
  "@scarf/scarf@1.4.0": false    # prisma 的遥测上报器：显式拒绝执行
  # 前端栈零新增（原型 #12 实测）：vite 8 转 rolldown（无 esbuild），rolldown/
  # @tailwindcss/oxide/lightningcss 全走 napi 预构建 optional deps，不带 postinstall。

# 供应链防护·包内 agent skills 默认不自动采纳（Spec-工程基座 §8；#63）。
# pnpm 12.21 只链接显式批准的依赖技能（skills/<name>/SKILL.md → .claude/skills）。
# @reduxjs/toolkit 2.15.0 携带 13 个 Redux 指南技能；经审查仍不链接——本项目只消费
# RTK Query 基础语义，不引入依赖注入的 agent 指令。任何新出现的待审批项（skills 或
# 构建脚本）由 workspace.Dockerfile deps 层的 check-permissions.sh 拦截（默认拒绝）。
permissions:
  "@reduxjs/toolkit":
    skills: false

# catalog 一律精确 pin（Spec-工程基座 §2：caret 会在 lockgen 重解析时静默漂移——
# 原型 #12 实测 @nestjs/common ^12.5.1 漂到 12.6.0 致编译断）。
# 取值 = 原型锁文件 2026-11-20 全绿验证集。
catalog:
  # 语言/类型（TS 锁 6.0.3：latest 已是 7.0.2 原生编译器，按版本矩阵决策暂不采用）
  typescript: "6.0.3"
  zod: "4.6.7"
  "@types/node": "26.6.6"
  # NestJS 12（ESM-only，peer typescript@^6）
  "@nestjs/common": "12.6.0"
  "@nestjs/core": "12.6.0"
  "@nestjs/platform-express": "12.6.0"
  "@nestjs/swagger": "12.1.2"
  reflect-metadata: "0.2.2"
  rxjs: "7.8.2"
  # Prisma 7（Rust-free：prisma-client generator + adapter-pg）；CLI latest 是 8.0.0-rc，不押 RC
  prisma: "7.10.1"
  "@prisma/client": "7.10.1"
  "@prisma/adapter-pg": "7.10.1"
  # 测试 / lint
  vitest: "5.1.1"
  eslint: "10.15.0"
  "@eslint/js": "10.0.1"
  typescript-eslint: "8.73.0"
  # 前端栈（React 19 / Vite 8 / antd 6 / Tailwind 4）
  react: "19.3.1"
  react-dom: "19.3.1"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  antd: "6.7.1"
  "@ant-design/icons": "6.3.4"
  "@reduxjs/toolkit": "2.15.0"
  react-redux: "9.3.1"
  react-leaflet: "5.0.0"
  leaflet: "1.9.4"
  "@types/leaflet": "1.9.22"
  vite: "8.3.8"
  "@vitejs/plugin-react": "6.3.0"
  tailwindcss: "4.3.5"
  "@tailwindcss/vite": "4.3.5"
  jsdom: "31.0.1"
  "@testing-library/react": "16.3.3"
  "@testing-library/dom": "10.4.2"
  "@testing-library/jest-dom": "8.0.0"
  eslint-plugin-react-hooks: "7.1.1"
