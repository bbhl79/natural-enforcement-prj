# PROTOTYPE（#11）— pnpm workspaces：包发现 + catalogs（第三方版本唯一事实源）
# 注：不声明 pnpm tasks（运行期命令走 pnpm -r 直跑、构建期走 turbo——见 devenv/NOTES.md）
packages:
  - apps/*
  - packages/*

# pnpm 12 供应链防护·新包冷却期：只认此处的 camelCase 键（npmrc 无效，实测 #11）。
# 默认策略拦截"发布过新"的包（ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION）；原型期=0。
# SPEC 决策点：确定性解析优先 vs 新包冷却期。
minimumReleaseAge: 0

# pnpm 12 供应链防护·构建脚本审批：键是 allowBuilds 且**必须带版本号**（裸包名不匹配，
# 实测 #11；onlyBuiltDependencies/ignoredBuiltDependencies 在 12.21 不生效）。
# 版本变更 → 此处需同步显式批准 = 强制人工/agent 审查点（AI-native 确定性友好）。
allowBuilds:
  prisma@7.10.1: true
  "@prisma/engines@7.10.1": true
  msgpackr-extract@3.0.7: true    # bullmq→msgpackr 的原生解压预构建
  "@scarf/scarf@1.4.0": false    # prisma 的遥测上报器：显式拒绝执行

catalog:
  # 语言/类型（TS 锁 6.0.3：latest 已是 7.0.2 原生编译器，按版本矩阵决策暂不采用）
  typescript: "6.0.3"
  zod: "4.6.7"
  "@types/node": "^26.6.6"
  # NestJS 12（ESM-only，peer typescript@^6）
  "@nestjs/common": "^12.5.1"
  "@nestjs/core": "^12.5.1"
  "@nestjs/platform-express": "^12.5.1"
  "@nestjs/testing": "^12.5.1"
  "@nestjs/swagger": "^12.1.2"
  reflect-metadata: "^0.2.2"
  rxjs: "^7.8.2"
  # Prisma 7（Rust-free：prisma-client generator + adapter-pg）
  # 注意：prisma CLI 的 npm latest 已是 8.0.0-rc.34（RC，不用）；三件套一律显式锁 7.10.1
  prisma: "7.10.1"
  "@prisma/client": "7.10.1"
  "@prisma/adapter-pg": "7.10.1"
  # 队列 / 对象存储
  bullmq: "^6.7.8"
  ioredis: "^6.0.0"
  "@aws-sdk/client-s3": "^3.1172.0"
  "@aws-sdk/s3-request-presigner": "^3.1172.0"
  # 测试 / lint（typescript-eslint 8.73 peer 接受 eslint ^10；eslint 10.15 为 latest）
  vitest: "^5.1.1"
  eslint: "^10.15.0"
  "@eslint/js": "^10.0.1"
  typescript-eslint: "^8.73.0"
