# CI 最小形态（#47 US21/#57）：只做编排，显式调用同一 dev 入口。
# 检查范围与本地严格一致——唯一差异是凭据注入回收（--ci 要求凭据来自环境变量）。
# 检查语义单一来源 = dev 脚本，本文件不另写检查脚本，也不加镜像准备步：
# 镜像拉取属 dev build 语义，冷 runner 由 dev check 内的 build 自举（#47 US31）。
# E1 从零建库不在本文件单列：它是 dev check → test e2e → e2e/cases/01-from-zero.sh
# 的既有职责。此前单列一步 ./dev db reset 排在任何镜像准备之前，干净 runner 上
# 必在 postgis 镜像检查处退出，E1 从未在 CI 上跑到。
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: run-id（时间戳 + 短随机；本地用同一 id 复现本次 run）
        id: run
        run: echo "run_id=$(date -u +%Y%m%d-%H%M%S)-$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')" >> "$GITHUB_OUTPUT"

      # 凭据注入回收：值来自环境，不写进 dev，也不写进本文件（ADR 0008、#80）。
      # 已配置 secrets 时用 secrets；未配置时 GitHub 传入空字符串，
      # 由 tools/ci-inject-env.sh 改取 infra/runtime.env 的开发夹具值，写入 GITHUB_ENV。
      # 本文件只出现清单里的变量名；结构测试 runtime-manifest 对字面量密钥与清单外变量名判红。
      - name: 凭据注入（secrets 优先，未配置时取 infra/runtime.env 夹具值）
        env:
          POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DEV_POSTGRES_DB }}
        run: bash tools/ci-inject-env.sh POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB

      - name: check（build 自举镜像 → lint 全量 → test all，本地同一命令；E1 在 e2e 层内）
        run: ./dev check --ci --run-id "${{ steps.run.outputs.run_id }}"

      - name: 上传 run 产物（日志与关键产物；失败现场用同一 run-id 本地复现）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ steps.run.outputs.run_id }}
          path: .run/${{ steps.run.outputs.run_id }}/
          if-no-files-found: ignore
